# Cấu hình Macropad15 - Pro Micro RP2040 (chỉ USB, không Bluetooth)

# ZMK Studio: sửa keymap trực tiếp trên https://zmk.studio (cần snippet studio-rpc-usb-uart trong build.yaml)
CONFIG_ZMK_STUDIO=y
CONFIG_SETTINGS=y

# Encoder EC11
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---- OLED SSD1306: màn hình trạng thái tùy biến (src/oled_status.c) ----
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_SSD1306_DEFAULT_CONTRAST=255

# Tự tắt màn hình sau 60 giây không dùng
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Đèn NumLock/CapsLock từ máy tính (hiện trên OLED)
CONFIG_ZMK_HID_INDICATORS=y

# Bật widget Label của LVGL (màn hình tùy biến dùng label; màn hình mặc định của ZMK tự bật)
CONFIG_LV_USE_LABEL=y

# Font cho chữ lớn / nhỏ trên OLED
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_40=y
